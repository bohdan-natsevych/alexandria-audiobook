services:
  alexandria:
    build: .
    ports:
      - "4200:4200"
    volumes:
      # Persist HuggingFace model cache (~3.5 GB per model, downloaded on first use)
      - hf_cache:/root/.cache/huggingface
      # Persist server configuration and reusable compute assets only.
      # Project state and audio remain in each browser's IndexedDB.
      - ./data/config:/alexandria/config
      - ./data/lora_models:/alexandria/lora_models
      - ./data/builtin_lora:/alexandria/builtin_lora
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  hf_cache:
